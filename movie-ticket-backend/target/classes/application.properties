server.port=8080

# Spring Application Name
spring.application.name=movie-ticket-backend

# Database Configuration (H2 In-Memory for instant out-of-the-box execution)
spring.datasource.url=jdbc:h2:mem:moviebookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Production Configuration (Uncomment to use MySQL Workbench / Local MySQL Server)
# spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For MySQL dialect, use: org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
com.moviebooking.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
com.moviebooking.jwtExpirationMs=86400000
